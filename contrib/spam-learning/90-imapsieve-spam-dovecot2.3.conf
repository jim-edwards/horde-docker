# Dovecot 2.3: learn spam/ham when messages are moved into or out of Spam.
# Copy to /etc/dovecot/conf.d/ and restart Dovecot (a reload is not enough).
# If mail_plugins is already set for imap elsewhere, add imap_sieve there instead.

protocol imap {
  mail_plugins = $mail_plugins imap_sieve
}

plugin {
  sieve_plugins = sieve_imapsieve sieve_extprograms
  sieve_global_extensions = +vnd.dovecot.pipe +vnd.dovecot.environment

  # Directory holding sa-learn-queue.sh
  sieve_pipe_bin_dir = /etc/dovecot/sieve-pipe

  # Into Spam (from any mailbox)
  imapsieve_mailbox1_name = Spam
  imapsieve_mailbox1_causes = COPY
  imapsieve_mailbox1_before = file:/etc/dovecot/sieve/report-spam.sieve

  # Out of Spam (into any mailbox)
  imapsieve_mailbox2_name = *
  imapsieve_mailbox2_from = Spam
  imapsieve_mailbox2_causes = COPY
  imapsieve_mailbox2_before = file:/etc/dovecot/sieve/report-ham.sieve
}
