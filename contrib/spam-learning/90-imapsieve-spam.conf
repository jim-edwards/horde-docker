# Dovecot 2.4: learn spam/ham when messages are moved into or out of Spam.
# Copy to /etc/dovecot/conf.d/ and restart Dovecot (a reload is not enough).

protocol imap {
  mail_plugins {
    imap_sieve = yes
  }
}

sieve_plugins {
  sieve_imapsieve = yes
  sieve_extprograms = yes
}

sieve_global_extensions {
  vnd.dovecot.pipe = yes
  vnd.dovecot.environment = yes
}

# Directory holding sa-learn-queue.sh
sieve_pipe_bin_dir = /etc/dovecot/sieve-pipe

# Into Spam (from any mailbox)
mailbox Spam {
  sieve_script report-spam {
    type = before
    cause = copy
    path = /etc/dovecot/sieve/report-spam.sieve
  }
}

# Out of Spam (into any mailbox)
imapsieve_from Spam {
  sieve_script report-ham {
    type = before
    cause = copy
    path = /etc/dovecot/sieve/report-ham.sieve
  }
}
